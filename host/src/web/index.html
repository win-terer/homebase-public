    <!-- 화면 밝기를 React 보다 먼저 정해서 첫 화면이 깜빡이지 않게 (shared/ui/src/theme-boot.ts 의 THEME_BOOT 와 같아야 함, 테스트가 확인) -->
    <script>try{var m=localStorage.getItem("hb.theme");document.documentElement.dataset.theme=m==="light"||m==="dark"?m:matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"}catch(e){}</script>
